services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: franzis-bar
    environment:
      DATABASE_URL: file:/data/app.db
      NODE_ENV: production
      SESSION_SECRET: ${SESSION_SECRET:-change-me-in-portainer-32-characters-minimum}
      BAR_PIN: ${BAR_PIN:-1234}
      ADMIN_PIN: ${ADMIN_PIN:-9999}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - "${HOST_PORT:-3000}:3000"
    volumes:
      - bar_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

volumes:
  bar_data:
